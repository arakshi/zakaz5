{% extends 'base.html' %}
{% block content %}
<h1>Мои заказы</h1>
<form class="row g-2 mb-3"><div class="col"><input class="form-control" name="phone" placeholder="Телефон" value="{{ phone }}"></div><div class="col"><input class="form-control" name="email" placeholder="Email" value="{{ email }}"></div><div class="col"><button class="btn btn-outline-success w-100">Найти</button></div></form>
{% if orders %}<table class="table"><tr><th>Номер</th><th>Статус</th><th>Сумма</th></tr>{% for o in orders %}<tr><td>{{ o.order_number }}</td><td>{{ o.status.value }}</td><td>{{ o.total_amount }}</td></tr>{% endfor %}</table>{% else %}<p class="text-muted">Пока нет заказов.</p>{% endif %}
{% endblock %}
