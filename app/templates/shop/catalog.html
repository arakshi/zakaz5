{% extends 'base.html' %}
{% block content %}
<h1>Каталог</h1>
<form class="row g-2 mb-3" method="get">
  <div class="col-md-5"><input class="form-control" name="q" value="{{ query }}" placeholder="Поиск"></div>
  <div class="col-md-4"><select class="form-select" name="category"><option value="">Все категории</option>{% for c in categories %}<option value="{{ c.slug }}" {% if selected_category==c.slug %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
  <div class="col-md-3"><button class="btn btn-success w-100">Фильтровать</button></div>
</form>
<div class="row g-3">{% for p in products %}<div class="col-md-3"><div class="card h-100"><img src="{{ p.image_url or 'https://picsum.photos/400/300?random=' ~ p.id }}" class="card-img-top"><div class="card-body"><a href="/product/{{ p.slug }}">{{ p.name }}</a><div>{{ p.price }} ₽</div><form method="post" action="/cart/add"><input type="hidden" name="product_id" value="{{ p.id }}"><button class="btn btn-outline-success btn-sm mt-2">В корзину</button></form></div></div></div>{% endfor %}</div>
{% endblock %}
