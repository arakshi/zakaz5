<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bloom</title>
  <link rel="icon" href="/static/images/favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-success" href="/">Bloom</a>
    <div class="navbar-nav gap-2 align-items-center">
      <a class="nav-link" href="/catalog">Каталог</a>
      <a class="nav-link" href="/about">О магазине</a>
      <a class="nav-link" href="/contacts">Контакты</a>
      <a class="nav-link" href="/cart">Корзина ({{ request.session.get("cart", {})|length }})</a>
      <a class="nav-link" href="/my-orders">Мои заказы</a>
      {% if request.session.get('user_id') %}
        <a class="btn btn-sm btn-success" href="/admin">Админка</a>
        <a class="btn btn-sm btn-outline-secondary" href="/auth/logout">Выйти</a>
      {% else %}
        <a class="btn btn-sm btn-outline-success" href="/auth/login">Вход в админку</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
