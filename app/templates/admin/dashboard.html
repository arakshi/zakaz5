{% extends 'base.html' %}
{% block content %}
<h1>Admin Dashboard</h1>
<div class="d-flex gap-2 mb-3">
<form method="post" action="/admin/demo/fill"><button class="btn btn-success">Заполнить демо-статистикой</button></form>
<form method="post" action="/admin/demo/clear"><button class="btn btn-outline-danger">Убрать демо-данные</button></form>
</div>
<div class="row g-3 mb-4">{% for k,v in metrics.kpi.items() %}<div class="col-md-3"><div class="card"><div class="card-body"><small>{{ k }}</small><div class="fs-4">{{ v }}</div></div></div></div>{% endfor %}</div>
<div class="row g-4">
  <div class="col-md-6"><canvas id="statusChart"></canvas></div>
  <div class="col-md-6"><canvas id="paymentChart"></canvas></div>
</div>
<script>
window.dashboardData = {{ metrics | tojson }};
</script>
{% endblock %}
